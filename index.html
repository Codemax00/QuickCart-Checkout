<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  
  <div class="tab-container">
    <div id="signInTab" class="tab active" onclick="switchTab('signin')">Sign In</div>
    <div id="signUpTab" class="tab" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <!-- Sign In Form -->
  <div id="signInForm" class="form-group active">
    <h2>Sign In</h2>
    <input type="text" id="username" placeholder="Enter Username" autocomplete="username">
    <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password">
    <div class="checkbox">
      <input type="checkbox" id="rememberMe"> Remember Me
    </div>
    <div class="button-container">
      <button onclick="login()">Login</button>
      <button class="reset" onclick="clearFields('signin')">Clear</button>
    </div>
  </div>

  <!-- Sign Up Form -->
  <div id="signUpForm" class="form-group">
    <h2>Sign Up</h2>
    <input type="text" id="regUsername" placeholder="Enter Username" autocomplete="username">
    <input type="email" id="regEmail" placeholder="Enter Email" autocomplete="email">
    <input type="password" id="regPassword" placeholder="Enter Password" autocomplete="new-password">
    <input type="password" id="regConfirmPassword" placeholder="Confirm Password" autocomplete="new-password">
    <div class="button-container">
      <button onclick="signUp()">Register</button>
      <button class="reset" onclick="clearFields('signup')">Clear</button>
    </div>
  </div>

  <p id="msg"></p>

</div>

<script src="script.js"></script>

</body>
</html>
